<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="#030712" />
  <!-- Radial aura -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlow)" />
  <!-- Orbital ellipse -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-30 32 32)" stroke-dasharray="120" stroke-dashoffset="10" />
  <!-- Secondary inner ring -->
  <ellipse cx="32" cy="32" rx="14" ry="5.5" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5" transform="rotate(35 32 32)" />
  <!-- Core Node -->
  <circle cx="32" cy="32" r="4.5" fill="#f8fafc" />
  <circle cx="32" cy="32" r="2" fill="#38bdf8" />
  <!-- Satellite Planet -->
  <circle cx="48" cy="22" r="3" fill="#38bdf8" />
  <circle cx="16" cy="42" r="2" fill="#c084fc" />
  <!-- Sparkle stars -->
  <circle cx="18" cy="18" r="1" fill="#f8fafc" opacity="0.8" />
  <circle cx="46" cy="48" r="1.2" fill="#f8fafc" opacity="0.9" />
</svg>